name: CI/CD Docker Pipeline

on:
  pull_request:
    branches:
      - release  # PR이 release 브랜치로 병합될 때 트리거

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v2

      - name: application.yaml 파일 설정
        run: |
          touch ./src/main/resources/application.yaml
          echo "${{ secrets.YAML }}" > ./src/main/resources/application.yaml

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker 이미지 빌드 (웹 애플리케이션)
        run: |
          IMAGE_NAME=${{ vars.SERVICE_NAME }}
          PR_NUMBER=${{ github.event.pull_request.number }}
          docker build -t ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$PR_NUMBER -f Dockerfile .

      - name: Docker 이미지 푸시 (웹 애플리케이션)
        run: |
          IMAGE_NAME=${{ vars.SERVICE_NAME }}
          PR_NUMBER=${{ github.event.pull_request.number }}
          docker push ${{ secrets.DOCKER_USERNAME }}/$IMAGE_NAME:$PR_NUMBER

      - name: 빌드 성공 시 Slack 알림
        if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": ":white_check_mark: ${{ vars.SERVICE_NAME }} 빌드가 성공했습니다! PR 번호: #${{ github.event.pull_request.number }}",
              "username": "github-actions"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 빌드 실패 시 Slack 알림
        if: failure()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": ":x: ${{ vars.SERVICE_NAME }} 빌드가 실패했습니다! PR 번호: #${{ github.event.pull_request.number }}<${{ github.event.pull_request.html_url }}|PR 링크>",
              "username": "github-actions"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: EC2에 배포
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            sudo docker stop ${{ vars.SERVICE_NAME }}
            sudo docker rm ${{ vars.SERVICE_NAME }}
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/${{ vars.SERVICE_NAME }}:${{ github.event.pull_request.number }}
            sudo docker run -d --name ${{ vars.SERVICE_NAME }} -p 8080:8080 ${{ secrets.DOCKER_USERNAME }}/${{ vars.SERVICE_NAME }}:${{ github.event.pull_request.number }}

      - name: 배포 성공 시 Slack 알림
        if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": ":white_check_mark: ${{ vars.SERVICE_NAME }} 배포가 완료되었습니다! 배포 버전: #${{ github.event.pull_request.number }} <${{ github.event.pull_request.html_url }}|release link>",
              "username": "github-actions"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 배포 실패 시 Slack 알림
        if: failure()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": ":x: ${{ vars.SERVICE_NAME }} 배포가 실패했습니다! PR 번호: #${{ github.event.pull_request.number }} <${{ github.event.pull_request.html_url }}|release link>",
              "username": "github-actions"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
