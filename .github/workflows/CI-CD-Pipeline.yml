name: CI/CD Docker Pipeline

on:
  pull_request:
    branches:
      - release  # PR이 release 브랜치로 병합될 때 트리거


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v2

      - name: application.yaml 파일 설정
        run: |
          touch ./src/main/resources/application.yaml
          echo "${{ secrets.YAML }}" > ./src/main/resources/application.yaml

      - name: Docker Hub 로그인
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Docker 이미지 빌드 (웹 애플리케이션)
        run: |
          IMAGE_NAME=${{ github.repository }}
          PR_NUMBER=${{ github.event.pull_request.number }}
          docker build -t $IMAGE_NAME:$PR_NUMBER -f Dockerfile .

      - name: Docker 이미지 푸시 (웹 애플리케이션)
        run: |
          IMAGE_NAME=${{ github.repository }}
          PR_NUMBER=${{ env.PR_NUMBER }}
          docker push $IMAGE_NAME:$PR_NUMBER

      - name: 빌드 성공 시 Slack 알림
        if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": ":white_check_mark: ${{ github.repository }} 빌드가 성공했습니다! PR 번호: #${{ github.event.pull_request.number }}",
              "username": "github-actions",
              "icon_emoji": ":rocket:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 빌드 실패 시 Slack 알림
        if: failure()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": ":x: ${{ github.repository }} 빌드가 실패했습니다! PR 번호: #${{ github.event.pull_request.number }}\n<${{ github.event.pull_request.html_url }}|PR 링크>",
              "username": "github-actions",
              "icon_emoji": ":warning:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: EC2에 배포
        env:
          HOST: ${{ secrets.EC2_HOST }}
          USER: ${{ secrets.EC2_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          DOCKER_IMAGE: ${{ github.repository }}:$PR_NUMBER
        run: |
          echo "$SSH_KEY" > ssh_key
          chmod 600 ssh_key
          ssh -o StrictHostKeyChecking=no -i ssh_key $USER@$HOST << 'EOF'
            PORT=8080
            EXISTING_CONTAINER_ID=\$(sudo docker ps -q --filter "publish=\$PORT")
        
            if [ "\$EXISTING_CONTAINER_ID" ]; then
              echo "Stopping existing container at port \$PORT..."
              sudo docker stop \$EXISTING_CONTAINER_ID
              sudo docker rm \$EXISTING_CONTAINER_ID
            fi
        
            IMAGE_NAME=$DOCKER_IMAGE
        
            sudo docker pull $IMAGE_NAME:$PR_NUMBER
          
            # 새로운 컨테이너 실행
            echo "Starting new container..."
            sudo docker run -d -p $PORT:8080 $IMAGE_NAME:$PR_NUMBER
          EOF

      - name: 배포 성공 시 Slack 알림
        if: success()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": ":white_check_mark: EC2에 ${{ github.repository }} 배포가 완료되었습니다! 배포 버전: pr-$PR_NUMBER \n<${{ github.event.pull_request.html_url }}|PR 링크>",
              "username": "github-actions",
              "icon_emoji": ":rocket:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 배포 실패 시 Slack 알림
        if: failure()
        uses: slackapi/slack-github-action@v1.23.0
        with:
          payload: |
            {
              "text": ":x: EC2에 ${{ github.repository }} 배포가 실패했습니다! PR 번호: pr-$PR_NUMBER \n<${{ github.event.pull_request.html_url }}|PR 링크>",
              "username": "github-actions",
              "icon_emoji": ":warning:"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
