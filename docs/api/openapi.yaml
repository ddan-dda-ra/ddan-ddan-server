openapi: 3.1.0
servers:
- url: https://dev-ddan-ddan-api.ddmz.org/
  description: Development API server URL
- url: https://ddan-ddan-api.ddmz.org/
  description: Production API server URL
- url: http://localhost:8080/
  description: Local API server URL
security:
- JWT: []
tags:
- name: 펫 카탈로그
  description: 사용 가능한 펫 메타데이터와 레벨별 미디어 URL 제공
paths:
  /v1/users/me:
    get:
      tags:
      - 유저
      summary: 내 정보 조회
      description: 내 정보를 조회합니다.
      operationId: getMyInfo
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - 유저
      summary: 내 정보 수정
      description: 내 정보를 수정합니다.
      operationId: updateMyInfo
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - 유저
      summary: 회원 탈퇴
      description: 회원 탈퇴합니다.
      operationId: deleteMyInfo
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithDrawRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
  /v1/users/me/main-pet:
    get:
      tags:
      - 유저
      summary: 메인 펫 조회
      description: 메인 펫을 조회합니다.
      operationId: getMainPet
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMainPetResponse"
    post:
      tags:
      - 유저
      summary: 메인 펫 설정
      description: 메인 펫을 설정합니다.
      operationId: setMainPet
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMainPetRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMainPetResponse"
  /v1/pets/{petId}/play:
    post:
      tags:
      - 펫
      summary: 펫 놀아주기
      description: 장난감을 사용해 펫과 놀아주어 성장시킵니다.
      operationId: playPet
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPetResponse"
  /v1/pets/{petId}/food:
    post:
      tags:
      - 펫
      summary: 펫 먹이 지급
      description: 펫에게 먹이를 지급해 성장시킵니다.
      operationId: feedPet
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPetResponse"
  /v1/pets/me:
    get:
      tags:
      - 펫
      summary: 내가 소유한 펫 조회
      description: 내가 소유한 펫을 모두 조회합니다.
      operationId: getMyPets
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetsResponse"
    post:
      tags:
      - 펫
      summary: 펫 추가
      description: 펫을 추가합니다.
      operationId: addMyPet
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPetRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetResponse"
  /v1/pets/me/random:
    post:
      tags:
      - 펫
      summary: 랜덤 펫 추가
      description: 랜덤으로 펫을 추가합니다.
      operationId: addRandomPet
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetResponse"
  /v1/pets/me/gacha:
    post:
      tags:
      - 펫
      summary: 티켓 랜덤 펫 뽑기
      description: "티켓 하나를 소모하여, 랜덤으로 펫을 추가합니다."
      operationId: gachaRandomPet
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetResponse"
  /v1/friends/invite-codes:
    post:
      tags:
      - 친구
      summary: 초대코드 생성
      description: 새로운 초대코드를 생성합니다.
      operationId: generateInviteCode
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
  /v1/friends/by-invite/{code}:
    post:
      tags:
      - 친구
      summary: 초대코드로 친구 추가
      description: 초대코드를 사용하여 친구를 추가합니다.
      operationId: addFriendByInviteCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /v1/cheers/{friendId}:
    post:
      tags:
      - 응원하기
      summary: 친구 응원하기
      description: "친구에게 응원을 보냅니다. 하루에 한 번만 가능하며, 친구 관계인 사용자에게만 응원할 수 있습니다."
      operationId: cheerFriend
      parameters:
      - name: friendId
        in: path
        description: 응원할 친구의 사용자 ID
        required: true
        schema:
          type: string
        example: 64a1b2c3d4e5f6789012346
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CheerResponse"
  /v1/auth/reissue:
    post:
      tags:
      - 로그인 & 인증
      operationId: refresh
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /v1/auth/login:
    post:
      tags:
      - 로그인 & 인증
      operationId: login
      parameters:
      - name: X-Mock-OAuth
        in: header
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /v1/users/me/settings:
    patch:
      tags:
      - 유저
      summary: 유저 설정 수정
      description: 유저 설정을 수정합니다.
      operationId: updateUserSetting
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSettingResponse"
  /v1/users/me/daily-calorie:
    patch:
      tags:
      - 유저
      summary: 일일 칼로리 갱신 & 먹이 지급
      description: 일일 칼로리를 갱신하고 먹이를 지급합니다.
      operationId: updateDailyCalorieAndRewardFood
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalorieRequest"
        required: true
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDailyInfoResponse"
  /v1/users/{userId}:
    get:
      tags:
      - 유저
      summary: 유저 조회
      description: 특정 유저의 정보를 조회합니다.
      operationId: getUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ObjectId"
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
  /v1/ranking:
    get:
      tags:
      - 랭킹
      summary: 랭킹 조회
      description: 랭킹을 조회합니다.
      operationId: getRanking
      parameters:
      - name: criteria
        in: query
        required: true
        schema:
          type: string
          enum:
          - TOTAL_CALORIES
          - TOTAL_SUCCEEDED_DAYS
          - TOTAL_ATTENDANCE_DAYS
      - name: periodType
        in: query
        required: true
        schema:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RankingResponse"
  /v1/pets/{petId}:
    get:
      tags:
      - 펫
      summary: 펫 조회
      description: 특정 펫을 조회합니다.
      operationId: getPet
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetResponse"
  /v1/pets/catalog:
    get:
      tags:
      - 펫 카탈로그
      summary: 펫 카탈로그 조회
      description: 활성 펫 목록과 revision을 항상 200으로 반환합니다.
      operationId: getCatalog
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: 성공
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetCatalogResponse"
        "401":
          description: 인증 필요
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetCatalogResponse"
  /v1/friends/me:
    get:
      tags:
      - 친구
      summary: 내 친구 목록 조회
      description: 내 친구 목록을 조회합니다.
      operationId: getMyFriends
      parameters:
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FriendListResponse"
  /v1/friends/invite-codes/{code}:
    get:
      tags:
      - 친구
      summary: 초대코드로 초대자 정보 조회
      description: 초대코드를 사용하여 초대자 정보를 조회합니다. (친구 추가 없음)
      operationId: getInviterByCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InviterResponse"
  /v1/friends/{friendId}:
    delete:
      tags:
      - 친구
      summary: 친구 삭제
      description: 친구 관계를 삭제합니다.
      operationId: removeFriend
      parameters:
      - name: friendId
        in: path
        required: true
        schema:
          type: string
      - name: X-Pet-Catalog-Version
        in: header
        description: 클라이언트가 저장한 펫 카탈로그 revision
        required: true
        schema:
          type: string
          format: date-time
      responses:
        "200":
          description: OK
          headers:
            X-Pet-Catalog-Download-Required:
              description: 펫 카탈로그와 에셋 갱신 필요 여부
              schema:
                type: boolean
components:
  schemas:
    UserRequest:
      type: object
      description: User 요청 DTO
      properties:
        name:
          type: string
          description: User 이름
          example: 딴딴한 유저
        purposeCalorie:
          type: integer
          format: int32
          description: User 목표 칼로리
          example: 100
          maximum: 1000
          minimum: 100
      required:
      - name
      - purposeCalorie
    UserResponse:
      type: object
      description: User 응답 DTO
      properties:
        id:
          type: string
          description: User 식별 ID
          example: ABCDEF1234567
        name:
          type: string
          description: User 표기 이름
          example: UserName
        purposeCalorie:
          type: integer
          format: int32
          description: User 목표 칼로리
          example: 100
          maximum: 1000
          minimum: 100
        foodQuantity:
          type: integer
          format: int32
          description: User 음식 수량
          example: 5
        toyQuantity:
          type: integer
          format: int32
          description: User 장난감 수량
          example: 2
        tickets:
          type: integer
          format: int32
          description: User 티켓 수량
          example: 0
        setting:
          $ref: "#/components/schemas/UserSettingResponse"
          description: User 설정 정보
      required:
      - foodQuantity
      - id
      - purposeCalorie
      - setting
      - tickets
      - toyQuantity
    UserSettingResponse:
      type: object
      description: UserSetting 응답 DTO
      properties:
        isAppPushOn:
          type: boolean
          description: 앱 푸시 여부
          example: true
      required:
      - isAppPushOn
    SetMainPetRequest:
      type: object
      description: 메인 펫 설정 요청 DTO
      properties:
        petId:
          type: string
          description: 펫 ID
          example: 1234567890
      required:
      - petId
    PetResponse:
      type: object
      description: 펫 정보 응답 DTO
      properties:
        id:
          type: string
          description: Pet 식별 ID
          example: ABCDEF1234567
        type:
          type: string
          description: Pet 종류 (PetCatalog.type)
          example: DOG
        level:
          type: integer
          format: int32
          description: Pet 레벨
          example: 1
        expPercent:
          type: number
          format: double
          description: 현재 레벨에 해당하는 경험치 퍼센트
          example: 15.5
      required:
      - expPercent
      - id
      - level
      - type
    UserMainPetResponse:
      type: object
      description: 메인 펫 정보 응답 DTO
      properties:
        mainPet:
          $ref: "#/components/schemas/PetResponse"
          description: 메인 펫 정보
    UserPetResponse:
      type: object
      description: 유저 & 펫 응답 DTO
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
          description: 유저
        pet:
          $ref: "#/components/schemas/PetResponse"
          description: 펫
      required:
      - pet
      - user
    AddPetRequest:
      type: object
      description: 펫 추가 요청 DTO
      properties:
        petType:
          type: string
          description: 펫 종류 (PetCatalog.type)
          example: DOG
          minLength: 1
      required:
      - petType
    InviteCodeResponse:
      type: object
      description: 초대코드 응답 DTO
      properties:
        code:
          type: string
          description: 초대코드
          example: ABC12345
        expiresAt:
          type: string
          format: date-time
          description: 만료 시간
          example: 2024-07-02T15:30:00
        createdAt:
          type: string
          format: date-time
          description: 생성 시간
          example: 2024-07-01T15:30:00
      required:
      - code
      - createdAt
      - expiresAt
    FriendUserInfo:
      type: object
      description: 친구 사용자 정보 DTO
      properties:
        id:
          type: string
          description: 사용자 ID
          example: 507f1f77bcf86cd799439011
        name:
          type: string
          description: 사용자 이름
          example: 홍길동
        mainPetType:
          type: string
          description: 주 펫 종류 (PetCatalog.type)
          example: DOG
        petLevel:
          type: integer
          format: int32
          description: 펫 레벨
          example: 1
      required:
      - id
    FriendshipResponse:
      type: object
      description: 친구 응답 DTO
      properties:
        id:
          type: string
          description: 친구 관계 ID
          example: 507f1f77bcf86cd799439011
        friendUser:
          $ref: "#/components/schemas/FriendUserInfo"
          description: 친구 사용자 정보
        createdAt:
          type: string
          format: date-time
          description: 친구 관계 생성 시간
          example: 2024-07-01T15:30:00
        acceptedAt:
          type: string
          format: date-time
          description: 친구 관계 수락 시간
          example: 2024-07-01T15:30:00
      required:
      - createdAt
      - friendUser
      - id
    CheerResponse:
      type: object
      description: 응원하기 응답 DTO
      properties:
        cheerId:
          type: string
          description: 응원 ID
          example: 64a1b2c3d4e5f6789012345
        cheereeId:
          type: string
          description: 응원받은 사용자 ID
          example: 64a1b2c3d4e5f6789012346
        date:
          type: string
          format: date
          description: 응원한 날짜
          example: 2024-08-23
        createdAt:
          type: string
          format: date-time
          description: 응원한 시각
          example: 2024-08-23T10:30:00
      required:
      - cheerId
      - cheereeId
      - createdAt
      - date
    RefreshTokenRequest:
      type: object
      description: Token Refresh 요청 DTO
      properties:
        refreshToken:
          type: string
          description: 리프레시 토큰
          example: REFRESH_TOKEN
      required:
      - refreshToken
    LoginResponse:
      type: object
      description: 로그인 응답 DTO
      properties:
        accessToken:
          type: string
          description: 엑세스 토큰
          example: ACCESS_TOKEN
        refreshToken:
          type: string
          description: 리프레시 토큰
          example: REFRESH_TOKEN
        user:
          $ref: "#/components/schemas/UserResponse"
        isOnboardingComplete:
          type: boolean
          description: 회원 온보딩 완료 여부
      required:
      - accessToken
      - isOnboardingComplete
      - refreshToken
      - user
    LoginRequest:
      type: object
      description: OAuth 로그인 요청 DTO
      properties:
        token:
          type: string
          description: OAuth 로그인 토큰
          example: KakaoToken
        tokenType:
          type: string
          description: OAuth 타입
          enum:
          - KAKAO
          - APPLE
          example: KAKAO
        deviceToken:
          type: string
          description: 디바이스 토큰
          example: DeviceToken
      required:
      - token
      - tokenType
    UserSettingRequest:
      type: object
      description: UserSetting 요청 DTO
      properties:
        isAppPushOn:
          type: boolean
          description: 앱 푸시 여부
          example: true
    CalorieRequest:
      type: object
      description: 칼로리 요청 DTO
      properties:
        calorie:
          type: integer
          format: int32
          description: 칼로리
          example: 100
      required:
      - calorie
    DailyInfoResponse:
      type: object
      description: 일일 정보 응답 DTO
      properties:
        id:
          type: string
          description: 일일 정보 식별 ID
          example: ABCDEF1234567
        userId:
          type: string
          description: 유저 식별 ID
          example: ABCDEF1234567
        date:
          type: string
          format: date
          description: 일자
          example: 2021-01-01
        calorie:
          type: integer
          format: int32
          description: 일일 칼로리
          example: 100
      required:
      - calorie
      - date
      - id
      - userId
    UserDailyInfoResponse:
      type: object
      description: User & DailyInfo 응답 DTO
      properties:
        user:
          $ref: "#/components/schemas/UserResponse"
          description: User
        dailyInfo:
          $ref: "#/components/schemas/DailyInfoResponse"
          description: DailyInfo
        rewardedFoodQuantity:
          type: integer
          format: int32
          description: 지급한 먹이 수량
        rewardedToyQuantity:
          type: integer
          format: int32
          description: 지급한 장난감 수량
      required:
      - dailyInfo
      - rewardedFoodQuantity
      - rewardedToyQuantity
      - user
    ObjectId:
      type: object
      properties:
        timestamp:
          type: integer
          format: int32
        date:
          type: string
          format: date-time
    UserProfileResponse:
      type: object
      properties:
        userId:
          type: string
        userName:
          type: string
        mainPet:
          $ref: "#/components/schemas/PetResponse"
        todayCalorie:
          type: integer
          format: int32
        monthlyReceivedCheerCount:
          type: integer
          format: int32
        isFriend:
          type: boolean
        isCheeredToday:
          type: boolean
      required:
      - isCheeredToday
      - isFriend
      - mainPet
      - monthlyReceivedCheerCount
      - todayCalorie
      - userId
      - userName
    RankingResponse:
      type: object
      description: 랭킹 조회 응답 DTO
      properties:
        criteria:
          type: string
          description: 랭킹 조회 기준
          enum:
          - TOTAL_CALORIES
          - TOTAL_SUCCEEDED_DAYS
          - TOTAL_ATTENDANCE_DAYS
          example: "TOTAL_CALORIES, TOTAL_SUCCEEDED_DAYS"
        periodType:
          type: string
          description: 랭킹 조회 기간
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
          example: "DAILY, WEEKLY, MONTHLY, YEARLY"
        ranking:
          type: array
          description: 랭킹 조회 결과
          items:
            $ref: "#/components/schemas/RankingUserStatResponse"
        myRanking:
          $ref: "#/components/schemas/RankingUserStatResponse"
          description: 내 랭킹 정보
      required:
      - criteria
      - myRanking
      - periodType
      - ranking
    RankingUserStatResponse:
      type: object
      description: 유저 랭킹 정보 DTO
      properties:
        rank:
          type: integer
          format: int32
          description: 랭킹
          example: 1
        userId:
          type: string
          description: 유저 ID
          example: userid
        userName:
          type: string
          description: 유저 이름
          example: 홍길동
        mainPetType:
          type: string
          description: 주 펫 종류 (PetCatalog.type)
          example: DOG
        petLevel:
          type: integer
          format: int32
          description: 펫 레벨
          example: 1
        totalCalories:
          type: integer
          format: int32
          description: 총 칼로리
          example: 1000
        totalSucceededDays:
          type: integer
          format: int32
          description: 총 성공 일수
          example: 10
      required:
      - mainPetType
      - petLevel
      - rank
      - totalCalories
      - totalSucceededDays
      - userId
      - userName
    PetsResponse:
      type: object
      description: 유저가 소유한 펫 응답 DTO
      properties:
        ownerUserId:
          type: string
          description: Pet 소유 User 식별 ID
        pets:
          type: array
          description: Pets
          items:
            $ref: "#/components/schemas/PetResponse"
      required:
      - ownerUserId
      - pets
    PetCatalogItemResponse:
      type: object
      properties:
        type:
          type: string
        name:
          type: string
        colorCode:
          type: string
        displayOrder:
          type: integer
          format: int32
        levels:
          type: array
          items:
            $ref: "#/components/schemas/PetCatalogLevelResponse"
      required:
      - colorCode
      - displayOrder
      - levels
      - name
      - type
    PetCatalogLevelResponse:
      type: object
      properties:
        level:
          type: integer
          format: int32
        imageUrl:
          type: string
        lottieDefaultUrl:
          type: string
        lottiePlayEatUrl:
          type: string
      required:
      - imageUrl
      - level
      - lottieDefaultUrl
      - lottiePlayEatUrl
    PetCatalogResponse:
      type: object
      properties:
        revision:
          type: string
        pets:
          type: array
          items:
            $ref: "#/components/schemas/PetCatalogItemResponse"
      required:
      - pets
      - revision
    FriendListResponse:
      type: object
      description: 친구 목록 응답 DTO
      properties:
        friends:
          type: array
          description: 친구 목록
          items:
            $ref: "#/components/schemas/FriendUserInfo"
        totalCount:
          type: integer
          format: int32
          description: 총 친구 수
          example: 5
      required:
      - friends
      - totalCount
    InviterResponse:
      type: object
      description: 초대자 정보 응답 DTO
      properties:
        inviterUser:
          $ref: "#/components/schemas/FriendUserInfo"
          description: 초대자 사용자 정보
      required:
      - inviterUser
    WithDrawRequest:
      type: object
      description: 탈퇴 요청 DTO
      properties:
        cause:
          type: string
          description: 탈퇴 사유
          example: 사유
      required:
      - cause
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
