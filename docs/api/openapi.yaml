openapi: 3.1.0
servers:
- url: https://dev-ddan-ddan-api.ddmz.org/
  description: Development API server URL
- url: https://ddan-ddan-api.ddmz.org/
  description: Production API server URL
- url: http://localhost:8080/
  description: Local API server URL
security:
- JWT: []
tags:
- name: Admin · 유저
  description: 운영자용 유저 조회
- name: Admin · 인증
  description: 운영자 로그인
- name: Admin · 펫 카탈로그
  description: 운영자용 펫 카탈로그 CRUD
- name: Admin · 통계
  description: 운영자용 통계 대시보드
- name: 펫 카탈로그
  description: 사용 가능한 펫 메타데이터와 레벨별 미디어 URL 제공
paths:
  /v1/users/me:
    get:
      tags:
      - 유저
      summary: 내 정보 조회
      description: 내 정보를 조회합니다.
      operationId: getMyInfo
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    put:
      tags:
      - 유저
      summary: 내 정보 수정
      description: 내 정보를 수정합니다.
      operationId: updateMyInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserResponse"
    delete:
      tags:
      - 유저
      summary: 회원 탈퇴
      description: 회원 탈퇴합니다.
      operationId: deleteMyInfo
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WithDrawRequest"
        required: true
      responses:
        "200":
          description: OK
  /v1/admin/pet-catalog/{type}:
    put:
      tags:
      - Admin · 펫 카탈로그
      summary: 펫 카탈로그 수정
      operationId: update
      parameters:
      - name: type
        in: path
        description: 수정할 펫 카탈로그 타입
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetCatalogAdminUpdateRequest"
        required: true
      responses:
        "200":
          description: 수정 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetCatalogAdminItemResponse"
        "400":
          description: 요청 값 검증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 펫 카탈로그 항목 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Admin · 펫 카탈로그
      summary: 펫 카탈로그 비활성화 (soft delete)
      operationId: softDelete
      parameters:
      - name: type
        in: path
        description: 비활성화할 펫 카탈로그 타입
        required: true
        schema:
          type: string
      responses:
        "200":
          description: 비활성화 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetCatalogAdminItemResponse"
        "401":
          description: 인증 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: 펫 카탈로그 항목 없음
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/users/me/main-pet:
    get:
      tags:
      - 유저
      summary: 메인 펫 조회
      description: 메인 펫을 조회합니다.
      operationId: getMainPet
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMainPetResponse"
    post:
      tags:
      - 유저
      summary: 메인 펫 설정
      description: 메인 펫을 설정합니다.
      operationId: setMainPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMainPetRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserMainPetResponse"
  /v1/pets/{petId}/play:
    post:
      tags:
      - 펫
      summary: 펫 놀아주기
      description: 장난감을 사용해 펫과 놀아주어 성장시킵니다.
      operationId: playPet
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPetResponse"
  /v1/pets/{petId}/food:
    post:
      tags:
      - 펫
      summary: 펫 먹이 지급
      description: 펫에게 먹이를 지급해 성장시킵니다.
      operationId: feedPet
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserPetResponse"
  /v1/pets/me:
    get:
      tags:
      - 펫
      summary: 내가 소유한 펫 조회
      description: 내가 소유한 펫을 모두 조회합니다.
      operationId: getMyPets
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetsResponse"
    post:
      tags:
      - 펫
      summary: 펫 추가
      description: 펫을 추가합니다.
      operationId: addMyPet
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddPetRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetResponse"
  /v1/pets/me/random:
    post:
      tags:
      - 펫
      summary: 랜덤 펫 추가
      description: 랜덤으로 펫을 추가합니다.
      operationId: addRandomPet
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetResponse"
  /v1/pets/me/gacha:
    post:
      tags:
      - 펫
      summary: 티켓 랜덤 펫 뽑기
      description: "티켓 하나를 소모하여, 랜덤으로 펫을 추가합니다."
      operationId: gachaRandomPet
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetResponse"
  /v1/friends/invite-codes:
    post:
      tags:
      - 친구
      summary: 초대코드 생성
      description: 새로운 초대코드를 생성합니다.
      operationId: generateInviteCode
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InviteCodeResponse"
  /v1/friends/by-invite/{code}:
    post:
      tags:
      - 친구
      summary: 초대코드로 친구 추가
      description: 초대코드를 사용하여 친구를 추가합니다.
      operationId: addFriendByInviteCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FriendshipResponse"
  /v1/cheers/{friendId}:
    post:
      tags:
      - 응원하기
      summary: 친구 응원하기
      description: "친구에게 응원을 보냅니다. 하루에 한 번만 가능하며, 친구 관계인 사용자에게만 응원할 수 있습니다."
      operationId: cheerFriend
      parameters:
      - name: friendId
        in: path
        description: 응원할 친구의 사용자 ID
        required: true
        schema:
          type: string
        example: 64a1b2c3d4e5f6789012346
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/CheerResponse"
  /v1/auth/reissue:
    post:
      tags:
      - 로그인 & 인증
      operationId: refresh
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /v1/auth/login:
    post:
      tags:
      - 로그인 & 인증
      operationId: login
      parameters:
      - name: X-Mock-OAuth
        in: header
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /v1/admin/pet-catalog:
    get:
      tags:
      - Admin · 펫 카탈로그
      summary: 전체 펫 카탈로그 조회 (비활성 포함)
      operationId: list
      responses:
        "200":
          description: 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetCatalogAdminListResponse"
        "401":
          description: 인증 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - Admin · 펫 카탈로그
      summary: 펫 카탈로그 신규 등록
      operationId: create
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetCatalogAdminCreateRequest"
        required: true
      responses:
        "200":
          description: 등록 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetCatalogAdminItemResponse"
        "400":
          description: 요청 값 검증 실패
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: 인증 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: 관리자 권한 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: 중복된 펫 카탈로그 타입
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/admin/auth/login:
    post:
      tags:
      - Admin · 인증
      summary: 운영자 로그인
      description: ID/PW 검증 후 어드민 access token 발급 (1일 만료)
      operationId: login_1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/AdminLoginResponse"
  /v1/users/me/settings:
    patch:
      tags:
      - 유저
      summary: 유저 설정 수정
      description: 유저 설정을 수정합니다.
      operationId: updateUserSetting
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserSettingRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserSettingResponse"
  /v1/users/me/daily-calorie:
    patch:
      tags:
      - 유저
      summary: 일일 칼로리 갱신 & 먹이 지급
      description: 일일 칼로리를 갱신하고 먹이를 지급합니다.
      operationId: updateDailyCalorieAndRewardFood
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CalorieRequest"
        required: true
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserDailyInfoResponse"
  /v1/users/{userId}:
    get:
      tags:
      - 유저
      summary: 유저 조회
      description: 특정 유저의 정보를 조회합니다.
      operationId: getUser
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/ObjectId"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
  /v1/ranking:
    get:
      tags:
      - 랭킹
      summary: 랭킹 조회
      description: 랭킹을 조회합니다.
      operationId: getRanking
      parameters:
      - name: criteria
        in: query
        required: true
        schema:
          type: string
          enum:
          - TOTAL_CALORIES
          - TOTAL_SUCCEEDED_DAYS
          - TOTAL_ATTENDANCE_DAYS
      - name: periodType
        in: query
        required: true
        schema:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
          - YEARLY
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/RankingResponse"
  /v1/pets/{petId}:
    get:
      tags:
      - 펫
      summary: 펫 조회
      description: 특정 펫을 조회합니다.
      operationId: getPet
      parameters:
      - name: petId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetResponse"
  /v1/pets/catalog:
    get:
      tags:
      - 펫 카탈로그
      summary: 펫 카탈로그 조회
      description: 활성 펫 목록과 카탈로그 버전 반환. 클라이언트는 응답의 version 또는 X-Pet-Catalog-Version
        헤더로 stale 캐시 감지 가능.
      operationId: getCatalog
      responses:
        "200":
          description: 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetCatalogResponse"
        "401":
          description: 인증 필요
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PetCatalogResponse"
  /v1/friends/me:
    get:
      tags:
      - 친구
      summary: 내 친구 목록 조회
      description: 내 친구 목록을 조회합니다.
      operationId: getMyFriends
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/FriendListResponse"
  /v1/friends/invite-codes/{code}:
    get:
      tags:
      - 친구
      summary: 초대코드로 초대자 정보 조회
      description: 초대코드를 사용하여 초대자 정보를 조회합니다. (친구 추가 없음)
      operationId: getInviterByCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/InviterResponse"
  /v1/admin/users:
    get:
      tags:
      - Admin · 유저
      summary: 유저 목록·검색 (페이징)
      operationId: list_1
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: LATEST_LOGIN
          enum:
          - LATEST_LOGIN
          - JOINED
          - JOINED_ASC
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserAdminListResponse"
  /v1/admin/users/{id}:
    get:
      tags:
      - Admin · 유저
      summary: 유저 상세
      operationId: detail
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/UserAdminDetailResponse"
  /v1/admin/users/{id}/daily-calories:
    get:
      tags:
      - Admin · 유저
      summary: 유저 일별 칼로리 기록 조회
      description: 기간 미지정 시 최근 30일. from/to는 YYYY-MM-DD 형식. 최대 조회 기간 366일.
      operationId: dailyCalories
      parameters:
      - name: id
        in: path
        description: 유저 ObjectId hex string
        required: true
        schema:
          type: string
      - name: from
        in: query
        description: 조회 시작일 YYYY-MM-DD (미지정 시 to-29일)
        required: false
        schema:
          type: string
          format: date
      - name: to
        in: query
        description: 조회 종료일 YYYY-MM-DD (미지정 시 오늘)
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          description: 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DailyCaloriesAdminListResponse"
        "400":
          description: 기간 파라미터 오류 (from > to 또는 366일 초과)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DailyCaloriesAdminListResponse"
        "404":
          description: 유저 미존재
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/DailyCaloriesAdminListResponse"
  /v1/admin/stats/dashboard:
    get:
      tags:
      - Admin · 통계
      summary: 통계 대시보드
      description: "전체/신규/활성 유저, 펫 분포, 일별 가입 추이를 한 번에 반환. 날짜는 KST(Asia/Seoul) 기준.\
        \ 가입 시각은 ObjectId timestamp 사용."
      operationId: dashboard
      parameters:
      - name: seriesDays
        in: query
        description: "가입 추이 시리즈 길이(일). default 14, max 90"
        required: false
        schema:
          type: integer
          format: int32
          default: 14
          maximum: 90
          minimum: 1
      responses:
        "200":
          description: 통계 대시보드 조회 성공
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StatsAdminResponse"
        "400":
          description: seriesDays 파라미터 오류 (1~90 범위 외)
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/StatsAdminResponse"
  /v1/friends/{friendId}:
    delete:
      tags:
      - 친구
      summary: 친구 삭제
      description: 친구 관계를 삭제합니다.
      operationId: removeFriend
      parameters:
      - name: friendId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
components:
  schemas:
    UserRequest:
      type: object
      description: User 요청 DTO
      properties:
        name:
          type: string
          description: User 이름
          example: 딴딴한 유저
        purposeCalorie:
          type: integer
          format: int32
          description: User 목표 칼로리
          example: 100
          maximum: 1000
          minimum: 100
      required:
      - name
      - purposeCalorie
    UserResponse:
      type: object
      description: User 응답 DTO
      properties:
        id:
          type: string
          description: User 식별 ID
          example: ABCDEF1234567
        name:
          type: string
          description: User 표기 이름
          example: UserName
        purposeCalorie:
          type: integer
          format: int32
