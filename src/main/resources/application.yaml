spring:
  application:
    name: ddan-ddan-server
  profiles:
    active: dev

app:
  version:
    minimum:
      android: 1.5.0
      ios: 1.5.0

mock-oauth:
  enabled: false

springdoc:
  swagger-ui:
    operations-sorter: alpha
    display-request-duration: true
  model-and-view-allowed: true

logging:
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 30
      total-size-cap: 1GB
